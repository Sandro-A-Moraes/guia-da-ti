name: Validar e preparar site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publicar manualmente na VPS
        type: boolean
        default: false
  repository_dispatch:
    types: [catalog-updated]
  schedule:
    - cron: '17 * * * *'
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://guiadati.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Verificar atraso do agendamento
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 100,
            });
            const previous = data.workflow_runs
              .filter(run => run.id !== context.runId && run.conclusion === 'success')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

            if (!previous) {
              core.notice('Não há execução agendada anterior concluída para comparar.');
              return;
            }

            const hours = (Date.now() - Date.parse(previous.created_at)) / 3_600_000;
            const message = `A última execução agendada bem-sucedida começou há ${hours.toFixed(1)} horas.`;
            if (hours > 2) {
              core.warning(`${message} O intervalo esperado é de até duas horas.`);
              await core.summary.addHeading('Atraso no build agendado').addText(message).write();
            } else {
              core.notice(message);
            }
      - name: Buscar dados aprovados na main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: git -C database fetch origin main && git -C database checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/catalog/package-lock.json
            web/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts
        working-directory: tools/catalog
      - run: npm run validate && npm test
        working-directory: tools/catalog
      - run: npm ci
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
      - name: Testar regras do frontend
        run: node --test scripts/*.test.mjs
        working-directory: web/frontend
      - name: Verificar integração Discussions
        run: dotnet run --project web/backend/GuiaDaTi.Api.Tests
      - name: Recusar catálogo desatualizado
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git -C database ls-remote origin refs/heads/main | cut -f1)
          current=$(git -C database rev-parse HEAD)
          test "$latest" = "$current" || {
            echo "A main do catálogo avançou durante o build. SHA usado: $current; SHA atual: $latest. A próxima execução deve publicar os dados mais recentes."
            exit 1
          }
      - name: Preparar artefato
        run: |
          mkdir -p web/backend/GuiaDaTi.Api/wwwroot
          rsync -a --exclude server web/frontend/dist/ web/backend/GuiaDaTi.Api/wwwroot/
          dotnet publish web/backend/GuiaDaTi.Api -c Release -o artifact
          cp tools/catalog/dist/catalog.json artifact/catalog.json
          git -C database rev-parse HEAD > artifact/data-commit.txt
          git rev-parse HEAD > artifact/app-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: guia-da-ti
          path: artifact/
          retention-days: 7
      - name: Resumir falha do build agendado
        if: failure() && github.event_name == 'schedule'
        shell: bash
        run: |
          {
            echo '## Build agendado com falha'
            echo 'Consulte o primeiro passo com falha neste run. A próxima execução agendada registrará se houve um intervalo acima de duas horas.'
          } >> "$GITHUB_STEP_SUMMARY"
  package:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recusar publicação de uma versão antiga da main
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'A main mudou. Publique pela execução mais recente.'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: guia-da-ti
          path: artifact
      - name: Preparar imagem e pacote da publicação
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="guia-da-ti:$release"
          mkdir -p package
          docker build --file deploy/Dockerfile --tag "$image" artifact
          docker run --rm --network none --user root --entrypoint /bin/bash \
            --volume "$GITHUB_WORKSPACE:/repo:ro" "$image" /repo/deploy/check-deploy.sh
          trap 'docker rm -f guia-deploy-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name guia-deploy-smoke \
            --tmpfs /app/App_Data:uid=1654,gid=1654 "$image" > /dev/null
          docker exec guia-deploy-smoke curl --fail --silent --retry 20 \
            --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/health
          docker exec guia-deploy-smoke curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          # Internal files must stay unreachable by URL and readable only by the app user.
          docker exec guia-deploy-smoke curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/community/users
          docker exec guia-deploy-smoke bash -c 'set -euo pipefail
            for path in App_Data/community-users.json App_Data/auth/keys App_Data/auth/sessions GuiaDaTi.Api.dll runtime.env; do
              status=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:8080/$path")
              test "$status" = 404 || { echo "/$path returned HTTP $status"; exit 1; }
            done
            test "$(stat -c %a /app/App_Data/auth /app/App_Data/auth/keys /app/App_Data/auth/sessions | sort -u)" = 700'
          docker save "$image" | gzip > package/image.tar.gz
          cp deploy/compose.yml package/compose.yml
          printf '%s\n' "$image" > package/image.txt
          tar -czf release.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: guia-da-ti-release
          path: release.tar.gz
          retention-days: 7
  deploy:
    needs: [build, package]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       vars.VPS_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: guia-da-ti-vps-production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22022' }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/guia-da-ti' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://guiadati.com' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: guia-da-ti-release
          path: .
      - name: Recusar publicação de uma versão antiga da main
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'A main mudou. Publique pela execução mais recente.'; exit 1; }
      - name: Enviar e ativar na VPS
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test "$VPS_USER" != root
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          [[ "$VPS_PATH" =~ ^/opt/[a-zA-Z0-9_-]+$ ]]
          [[ "$SITE_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/guia-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/guia-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/guia-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/guia-ssh/key" "$RUNNER_TEMP/guia-ssh/known_hosts"
          ssh_options=(-F /dev/null -i "$RUNNER_TEMP/guia-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/guia-ssh/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$VPS_USER@$VPS_HOST"
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$target" "test -d '$VPS_PATH/incoming'"
          scp "${ssh_options[@]}" -P "$VPS_PORT" release.tar.gz "$target:$VPS_PATH/incoming/$release.tar.gz"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$target" "bash -s -- '$VPS_PATH' '$release' '$SITE_URL'" < deploy/deploy.sh
      - name: Remover chave temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/guia-ssh/key"
